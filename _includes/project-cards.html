<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin:30px 0">
{% for p in include.items limit: include.limit %}
  <div style="flex:1 1 280px;max-width:340px;border:1px solid rgba(255,255,255,0.45);border-radius:6px;padding:20px;text-align:left;background:rgba(0,0,0,0.35)">
    <div style="font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:0.75">{{ p.status }}</div>
    <h3 style="margin:8px 0 10px">{{ p.title }}</h3>
    <p>{{ p.summary }}</p>
    {% if p.url %}<a href="{{ p.url }}" class="btn btn-default">{{ p.link_label | default: "Learn more" }}</a>{% endif %}
  </div>
{% endfor %}
</div>
